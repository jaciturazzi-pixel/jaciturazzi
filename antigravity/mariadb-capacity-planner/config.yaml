  # Add remaining clusters here:
  # prod-sql-community, prod-sql-qfp, prod-sql-secure, prod-sql-secureinventory
  # ...

# ---------------------------------------------------------------------------
# Analysis thresholds
# ---------------------------------------------------------------------------

thresholds:
  cpu:
    per_core_saturation_pct: 75
    projected_max_after_downsize: 50
    context_switches_per_sec_warn: 50000
    skewness_warn: 1.5

  memory:
    min_free_pct_after_session_overhead: 15
    buffer_pool_hit_ratio_min: 99.5
    lru_freed_per_sec_warn: 1000
    oom_risk_score_veto: 80.0

  replication:
    sbm_micro_lag_threshold_sec: 5
    sbm_veto_percentile: 99
    micro_lag_min_duration_sec: 30

  disk:
    write_latency_p99_ms_io2_threshold: 2.0
    gp3_max_iops: 16000
    gp3_max_throughput_mbps: 1000
    iops_safety_factor: 1.4
    iops_floor: 3000

  runway:
    months: 6
    growth_factor: 1.10
    occupancy_alert_pct: 75
    occupancy_critical_pct: 85
    free_space_downsize_gb: 300

# ---------------------------------------------------------------------------
# Pricing (On-Demand, us-west-2)
# ---------------------------------------------------------------------------

pricing:
  ec2_hourly:
    prices:
      r8i.16xlarge: 4.170
      r8i.8xlarge: 2.085
      r8i.4xlarge: 1.0425
      r8i.2xlarge: 0.52125
      r8i.xlarge: 0.26063
      m8i.4xlarge: 0.768
      m8i.2xlarge: 0.384
      m8i.xlarge: 0.192

  ebs:
    io2_per_gb: 0.125
    io2_per_iops: 0.065
    gp3_per_gb: 0.08
    gp3_base_iops: 3000
    gp3_per_extra_iops: 0.005
    gp3_base_throughput_mbps: 125
    gp3_per_extra_throughput_mbps: 0.04

  hours_per_month: 730

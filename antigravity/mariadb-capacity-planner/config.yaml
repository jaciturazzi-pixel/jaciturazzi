# =============================================================================
# mcplanner — Configuration Template
# =============================================================================
# Copy this file to config.yaml and fill in your PMM credentials.
# Sensitive values support env-var substitution: ${PMM_PASSWORD}
# =============================================================================

pmm:
  base_url: "https://pmm-server.us-west-2.pool.minicliptech.com"
  auth_method: "basic"
  username: "capacityplanner"
  password: "S324ASD!.ERA'SA-DS&W3"
  verify_ssl: false
  timeout_seconds: 30

aws:
  profile: "miniclippool-databases"
  region: "us-west-2"

disk:
  data_device: "nvme4n1"
  data_mountpoint: "/mnt/storage"

# ---------------------------------------------------------------------------
# Node inventory
# ---------------------------------------------------------------------------
# Each node must have:
#   - label:           Human-readable name (matches PMM node_name)
#   - pmm_node_name:   Label in Prometheus (defaults to label)
#   - service_name:    mysqld_exporter service label (defaults to {label}-mysql)
#   - aws_instance_id: EC2 Instance ID
#   - cluster:         Cluster grouping
#   - role:            writer | reader | snapshot
# ---------------------------------------------------------------------------

nodes:
  # --- Cluster: prod-sql-awards ---
  - label: "prod-sql-awards010"
    aws_instance_id: "i-07af44ef17621173c"
    cluster: "prod-sql-awards"
    role: "writer"

  - label: "prod-sql-awards011"
    aws_instance_id: "i-0dbcb26f5c2ba1ec9"
    cluster: "prod-sql-awards"
    role: "reader"

  # --- Cluster: prod-sql-qfpsystem ---
  - label: "prod-sql-qfpsystem010"
    aws_instance_id: "i-09c9a04f362875256"
    cluster: "prod-sql-qfpsystem"
    role: "writer"

  - label: "prod-sql-qfpsystem011"
    aws_instance_id: "i-008b4544f2d4ef3f5"
    cluster: "prod-sql-qfpsystem"
    role: "reader"

  - label: "prod-sql-qfpsystem012"
    aws_instance_id: "i-02bf427581a221ce4"

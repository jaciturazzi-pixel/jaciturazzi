[project]
name = "mcplanner"
version = "2.0.0"
description = "MariaDB Capacity Planning & Rightsizing CLI — PMM/Prometheus Edition"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "requests>=2.31",
    "boto3>=1.34",
    "pyyaml>=6.0",
    "rich>=13.7",
    "numpy>=1.26",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-mock", "responses"]

[project.scripts]
mcplanner = "mcplanner.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
